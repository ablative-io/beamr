[package]
name = "beamr"
version = "0.19.4"
edition = "2024"
description = "A Rust runtime with the BEAM's execution model, targeting Gleam"
readme = "README.md"
license.workspace = true
repository.workspace = true
authors = [
    "Tom Whiting <tom@ablative.com.au>",
    "Josh Bearup <Joshuabearup1@gmail.com>",
]

[dependencies]
base64 = { version = "0.23.1", optional = true }
cranelift-codegen = { version = "0.134.3", optional = true }
cranelift-frontend = { version = "0.134.3", optional = true }
cranelift-jit = { version = "0.134.3", optional = true }
cranelift-module = { version = "0.134.3", optional = true }
cranelift-native = { version = "0.134.3", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
crossbeam-deque = { version = "0.8.6", optional = true }
# Hard dependency (B-144 R1): `mailbox/mod.rs` is ungated and uses SegQueue for
# the lock-free arrival queue, so under `--no-default-features` the optional
# form left an unresolvable import. Both `threads` and `cooperative` already
# pulled it in, so no shipped configuration gains a dependency here.
crossbeam-queue = "0.3.12"
dashmap = "6.1.0"
mio = { version = "1", features = ["os-poll", "net", "os-ext"], optional = true }
flate2 = "1.1.9"
gleam-types = { path = "../gleam-types", version = "0.4.4" }
libc = { version = "0.2.186", optional = true }
md5 = "0.8.0"
num_cpus = { version = "1.17.0", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
rand = "0.10.1"
unicode-segmentation = "1.12"
# Portable monotonic clock. On native targets `web_time::Instant` is a
# re-export of `std::time::Instant` (zero behavior change); on
# `wasm32-unknown-unknown` it is backed by `performance.now()`, so the
# cooperative native timer wheel no longer panics on the missing wasm time
# source. Used ONLY in the timer wheel + cooperative scheduler timer seam.
web-time = "1.1.0"
rustix = { version = "1.1.4", features = ["fs", "net"], optional = true }
serde_json = { version = "1.0.150", optional = true }
tokio = { version = "1.52.3", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync"], optional = true }
zstd = { version = "0.13.3", optional = true }

[dev-dependencies]
# Self-dependency so integration tests (which compile the lib WITHOUT
# cfg(test)) see the `test-support` instrumentation: the OS thread probe and
# the idle-park counter behind the signed §3.8 bound.
#
# ⛔ `default-features = false` IS LOAD-BEARING AND MUST STAY (#219). Without it
# this edge asks for `default = true`, and because cargo unifies features across
# graph edges, `--no-default-features` on the command line was SILENTLY
# OVERRIDDEN for every `cargo test`: the flag binds the package named on the
# command line, while this edge kept re-enabling threads/net/fs/jit/embedded/
# readiness behind it. MEASURED, not argued -- `cargo test -p beamr
# --no-default-features --features cooperative,json` compiled cranelift, tokio,
# mio, num_cpus and zstd, every one of them excluded on the command line.
#
# That is why nobody noticed the no-std error count drifting 1019 -> 1039: no
# test-shaped gate could select the configuration that would show it. The
# `nostd-ratchet` leg now watches the count; this line is what makes the
# configuration reachable from `cargo test` at all.
#
# ⚠️ This does NOT reduce what canon builds. beamr's defaults still arrive by two
# other paths -- beamr-cli depends on beamr with defaults, and beamr is itself a
# workspace member so `--workspace` enables its defaults directly. Only an
# explicit `--no-default-features` run changes behaviour, which is the point.
beamr = { path = ".", default-features = false, features = ["test-support"] }
criterion = "0.8.2"
# The in-memory exporters (`InMemory{Span,Metric,Log}Exporter`) used by the
# telemetry tests live behind opentelemetry_sdk's own `testing` feature; the
# SDK's `#[cfg(test)]` does not apply when it is compiled as our dependency,
# so the feature must be selected explicitly here.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
proptest = "1.11.0"

[[bench]]
name = "jit_comparison"
harness = false
required-features = ["jit", "threads"]

[[bench]]
name = "jit_comparison_extended"
harness = false
required-features = ["jit", "threads"]

[features]
default = ["std", "threads", "net", "fs", "jit", "embedded", "readiness"]
std = []
# Cooperative single-threaded runtime (WR-0 spike). Brings in only the
# lock-free SegQueue mailbox dependency; no tokio/crossbeam-channel/-deque,
# no io-uring, no num_cpus. Intended for wasm32 where OS threads are absent.
cooperative = ["std"]
threads = ["std", "dep:crossbeam-channel", "dep:crossbeam-deque", "dep:io-uring", "dep:num_cpus", "dep:tokio"]
readiness = ["threads", "dep:mio"]
net = ["std", "dep:libc", "dep:rustix", "dep:tokio"]
fs = ["std", "dep:libc", "dep:rustix"]
jit = ["std", "threads", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
embedded = ["std", "dep:zstd"]
json = ["dep:base64", "dep:serde_json"]
# `.beam` container writer — the mirror image of `loader::decode`. Off by
# default; brings in no new dependencies (flate2 is already a hard dep).
encode = []
test-support = []
telemetry = ["std", "dep:opentelemetry"]

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

# On wasm32 `getrandom` (pulled in transitively via `rand`) needs its browser
# JS backend; without this feature the wasm build fails to find a randomness
# source. Selecting the feature here is harmless on native targets where this
# target stanza does not apply.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
zstd = "0.13.3"
